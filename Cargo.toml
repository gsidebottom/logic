[package]
name = "logic"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sat-cover-verify"
path = "src/bin/sat_cover_verify.rs"

[[bin]]
name = "sat-drat-verify"
path = "src/bin/sat_drat_verify.rs"

[[bin]]
name = "gmi"
path = "src/bin/gmi.rs"

[[bin]]
name = "gmi_train"
path = "src/bin/gmi_train.rs"
required-features = ["gnn"]

[features]
# `evolve_guard` — runtime enforcement of the eff-layer ordering
# contracts (sum_visit_order is a permutation; prod_visit_order keeps
# all reachable alts).  OFF by default → zero overhead in production
# builds of known-sound code.  The OpenEvolve evaluator builds with
# `--features evolve_guard` to vet untrusted evolved candidates: a
# contract violation panics, so an unsound mutation can't score well.
# See src/dual/path_effective.rs (enforce_* helpers) and
# evo/evolve/evaluator.py.
evolve_guard = []
# `evolve_wide` — OPEN evolution mode: relaxes the eff-layer ordering
# contracts so an evolved policy MAY drop branches (sum_visit_order may
# return a subsequence; prod_visit_order may drop reachable alts) for
# aggressive pruning.  This makes a mutation potentially UNSOUND — that's
# intended; soundness is enforced downstream by the OpenEvolve
# evaluator's cover/witness + ground-truth (drat-verified label) checks,
# not by construction.  Mutually exclusive with `evolve_guard` (which
# would hard-abort the very mutations we want to run and verify).  An
# always-on index sanitizer (sanitize_indices) still guarantees no panic
# on a malformed index.  See src/dual/path_effective.rs.
evolve_wide = []
# GNN cut-scorer (Burn).  Optional + isolated so the default sat/gmi builds never
# pull burn; build with `cargo build --features gnn --bin gmi_train`.
gnn = ["dep:burn"]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "fs"] }
xq          = "0.5"
xq-lang     = "0.0.1"
cadical     = "0.1"
biodivine-lib-bdd = "0.6"
libc = "0.2.186"
num-bigint = "0.4"
num-rational = "0.4"
num-integer = "0.1"
num-traits = "0.2"
burn = { version = "0.21", features = ["ndarray", "autodiff"], optional = true }
