# OpenEvolve configuration for the matrix-method `eff` backend.
#
# Targets the three pure helper functions in
# src/dual/path_effective.rs (wrapped in EVOLVE-BLOCK markers).
# Mutations get scored against the evo/ benchmark set via
# evo/evolve/evaluator.py — see that file for the tiered scoring.

# ── Run length ──────────────────────────────────────────────────────
#
# Start: 5-iter smoke test to confirm wiring (no real exploration).
# Pilot: 50 iterations (~3-4 wall-hours w/ Opus + full-tier eval).
# Real:  200 iterations (~15 hours; bump when pilot signals signal).
#
# Override with `--iterations N` on the openevolve-run CLI.
max_iterations: 50
random_seed: 42

# ── LLM ─────────────────────────────────────────────────────────────
#
# Points at a LiteLLM proxy on localhost:4000 (started by run.sh).
# The proxy translates OpenAI-shaped requests to Bedrock /
# Anthropic / wherever you've configured it.  See evo/evolve/README.md
# for the LiteLLM proxy setup.
#
# Why ensemble: Opus for hard mutations (most weight); Sonnet for
# variety + cheap baseline exploration.  Drop Sonnet if you don't
# want to manage two model rows in the LiteLLM config.
llm:
  api_base: "http://localhost:4000/v1"
  # `model` is a fallback; `models` (ensemble) is what actually
  # gets used when present.
  model: "claude-opus"
  # NOTE: no `temperature` here.  Opus 4.8 / Sonnet 4.6 use adaptive
  # thinking and DEPRECATED the temperature parameter (sending it
  # 400s).  Sampling diversity is handled by the model's adaptive
  # thinking + OpenEvolve's MAP-Elites / island architecture.  The
  # reasoning budget (the real cost/quality lever) is set via
  # `reasoning_effort` injected at the LiteLLM proxy — see run.sh's
  # EFFORT env var.
  #
  # Per-call request timeout (seconds).  Default 60 is too short for
  # adaptive-thinking effort: at EFFORT=medium/high Opus spends well
  # over a minute reasoning, so 60s calls get abandoned + retried
  # (and a too-slow call burns all 4 retries identically → wasted
  # iteration + possibly billed thinking tokens).  300s comfortably
  # covers medium/high effort; the per-iteration eval is minutes
  # anyway, so a slow LLM call isn't the bottleneck.
  timeout: 300
  # Max output tokens per call.  Default 4096 is too small with
  # adaptive thinking: THINKING tokens count against this budget, so
  # at EFFORT=medium/high the reasoning can consume the whole 4096
  # and leave nothing for the actual code response → empty content →
  # "LLM returned None response".  This is a CAP, not a target — you
  # only pay for tokens actually generated (governed by `effort`), so
  # a generous cap costs nothing extra and just prevents truncation.
  # 16000 leaves comfortable room for medium-effort thinking (~8-10k)
  # plus the code diff (~2-3k); bump toward 32000 if you go high.
  max_tokens: 16000
  models:
    - name: "claude-opus"     # via LiteLLM proxy → bedrock or direct
      weight: 0.75
    - name: "claude-sonnet"   # cheaper, broader exploration
      weight: 0.25

# ── Search shape ────────────────────────────────────────────────────
#
# MAP-Elites archive — keeps diverse winners per "niche" (cell in
# the feature grid below) so the search doesn't collapse to a
# single local optimum.  num_islands lets multiple sub-populations
# evolve in parallel and exchange champions every migration_interval
# iterations.
database:
  population_size: 60
  num_islands: 3
  migration_interval: 15
  # Feature dimensions: how OpenEvolve buckets candidates for the
  # MAP-Elites archive.  We want diversity along these axes so the
  # final population spans the trade-off frontier.
  feature_dimensions:
    - "complexity"       # built-in: rough code size
    - "solved"           # primary fitness — solved-problem count
    - "timeout_progress" # tertiary — partial credit shape
  # How many bins per feature.  Higher = finer archive, slower
  # convergence but better diversity preservation.
  feature_bins: 8

# ── Evaluator wiring ─────────────────────────────────────────────────
evaluator:
  # OpenEvolve invokes evaluator.py with the candidate file path.
  # Set in CLI args, not here; keeping `enable_artifacts` on so the
  # failure_detail strings flow back to the LLM for repair.
  enable_artifacts: true
  # Multi-tier eval: our evaluator.py already cascades smoke → quick
  # → full internally, returning the deepest-reached metrics.  No
  # need for OpenEvolve's own cascade_evaluation here.
  cascade_evaluation: false
  # **OFF.**  When true, OpenEvolve makes a second LLM call per
  # candidate to subjectively rate code quality (readability /
  # maintainability / efficiency) and BLENDS those ~0.0-1.0 scores
  # into `combined_score`.  For a SAT-solver *performance* search
  # that's pure noise: it diluted our real objective (solve count /
  # speed / timeout-progress), manufactured fake "+0.0007 improved!"
  # deltas from rating jitter on near-identical candidates, and cost
  # an extra call per iteration.  With it off, `combined_score` is
  # exactly the benchmark fitness our evaluator returns, so "new
  # best" means a genuine solve/speed gain.
  use_llm_feedback: false

# ── Prompt ───────────────────────────────────────────────────────────
prompt:
  # Surface the contract from the EVOLVE-BLOCK doc-comment.  This is
  # what gets injected into every mutation prompt as context.
  system_message: |
    You are tuning the SEARCH-CONTROL heuristics of a matrix-method SAT
    solver's CDCL engine.  Two pure Rust functions are in play — see the
    EVOLVE-BLOCK comment for the full contract:

      restart_interval(restart_count, restart_unit) -> usize
          # conflicts to allow before the next restart
      vsids_decay(restart_count) -> f64
          # VSIDS activity decay applied per conflict (bump /= decay)

    These are PURE EFFICIENCY KNOBS.  CDCL reaches the same verdict for
    ANY restart schedule or decay rate — only the SPEED of convergence
    changes — so you CANNOT make a wrong answer here.  Optimise freely
    for speed.  (The caller clamps your outputs: restart interval >= 1,
    decay into (0,1); a degenerate/NaN return is replaced by a safe
    default, so don't worry about edge cases beyond returning a number.)

    HARD RULES:
      * Pure functions: no global state, no I/O, no panics.
      * `restart_interval` returns conflicts-until-next-restart (a small
        return → frequent restarts → broad exploration; a large return →
        rare restarts → deep dives).  Seed: luby(restart_count+1)*unit
        with unit≈100.  You may call the in-scope `luby(i)` helper
        (1-indexed Luby: 1,1,2,1,1,2,4,8,…) or invent any schedule.
      * `vsids_decay` returns the per-conflict decay (seed: 0.95).
        Lower = forget faster / chase recent conflicts; higher = longer
        memory.  May depend on restart_count to anneal over time.

    DESIGN IDEAS (these are the levers competitive CDCL solvers tune):
      * Restart schedule: scale the Luby unit up or down; switch to a
        geometric (unit * r^restart_count) or arithmetic schedule; very
        frequent early restarts then slower; glucose-style aggressive
        restarts.  Restart frequency is one of the highest-leverage CDCL
        knobs on hard structured UNSAT.
      * VSIDS decay: a higher decay (e.g. 0.99) keeps long-range history
        (good for some structured instances); a lower one (0.90) reacts
        to the current conflict cluster; annealing decay over restarts.
      * The two interact — e.g. frequent restarts pair well with a more
        reactive (lower) decay.

    You will be scored on (solved dominates):
      1. `solved`           — # of correct SAT/UNSAT verdicts in budget
      2. `neg_time`         — −total CPU on solved problems (more = faster)
      3. `timeout_progress` — partial credit on instances you DON'T solve:
         how far the search got (covered paths + CDCL conflict throughput,
         in log space).  Many hard instances solve 0 with astronomically
         large search spaces, so `solved` is flat there — THIS term is the
         gradient.  A schedule/decay that lets the search do MORE work
         (more conflicts, deeper coverage) in the budget scores higher
         even without tipping an instance to solved, and is the path to
         eventually solving more.

    Make small, targeted changes and reason about WHY a schedule/decay
    should converge faster on large structured instances.
  num_top_programs: 3
  num_diverse_programs: 2

# ── Output ──────────────────────────────────────────────────────────
# Per-iteration artifacts (candidate source, scores, prompts) land
# under evo/evolve/runs/<run-id>/.  Gitignored by default.
