[package]
name = "fmm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Fast matrix multiplication on Apple silicon in Rust: fused fast-scheme passes in safe Rust over Accelerate's GEMM"

[dependencies]
rayon = "1"

[features]
# the benchmarks against the C library (links ../build/libfmm.a and its kernels; with gpu, ../build/libfmm_gpu.a)
cbench = []
# the GPU as a second engine for a level's f32 products (links ../gpu_leaf.m and Metal), as the C library's GPU build
gpu = []

[[bin]]
name = "passbench"
required-features = ["cbench"]

[[bin]]
name = "crosscheck"
required-features = ["cbench"]

# its own workspace, apart from the repository's crate
[workspace]

[profile.release]
codegen-units = 1
