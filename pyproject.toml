[project]
name = "logic-tools"
version = "0.1.0"
description = "Python tooling for the matrix-method SAT solver in this repo (curation, benchmarking, plotting)."
readme = "tools/gbd/README.md"
# Cap below 3.14: uvloop (transitive via litellm[proxy] → uvicorn[standard])
# doesn't support Python 3.14 yet — 3.14 removed
# `asyncio.events.BaseDefaultEventLoopPolicy`, which uvloop imports at
# module load.  3.13 runs the whole stack (matplotlib, gbd-tools,
# openevolve, litellm) cleanly.  Bump the upper bound once uvloop
# ships a 3.14-compatible release.
requires-python = ">=3.9,<3.14"

# Runtime dependencies — these are everything the Python tools under
# tools/ and doc/ need beyond the standard library.  Conservative
# lower bounds: pin to versions we've tested with.  Tighten only when
# we hit an actual incompatibility.
dependencies = [
    # Cactus plot for benchmark sweeps (doc/competition-benchmarks-plot.py).
    "matplotlib>=3.7",
    # SAT-competition benchmark database client used by tools/gbd/*
    # (installs the `gbd` CLI into the venv's bin/).
    "gbd-tools>=4.5",
    # OpenEvolve — evolutionary code improvement, drives evo/evolve/
    # against the matrix-method eff backend's ordering policy.
    "openevolve>=0.2",
    # LiteLLM proxy — OpenAI-compatible HTTP shim in front of any
    # provider (Bedrock / Anthropic / OpenAI / Gemini / Ollama).
    # `[proxy]` extra pulls in the FastAPI server + boto3 for the
    # AWS Bedrock path.
    "litellm[proxy]>=1.50",
    "boto3>=1.34",
    # Resident-memory polling for run_benchmark's VeriPB --proof-mem-gb cap
    # (tree-aware; falls back to `ps` if psutil is absent).
    "psutil>=7.2.2",
    # Graph encoding + dataset arrays for the neural-SAT work (neural/).
    # Cross-platform core dep.  The ML backend (MLX on Apple Silicon, or
    # torch on the Linux GPU cluster) is added as an OPTIONAL extra at the
    # encoder step (#93) — kept out of core so the project still installs
    # where its platform's accelerator isn't available.
    "numpy>=1.24",
]

# Keep the package itself out of "site-packages" — this project is a
# collection of scripts under tools/ and doc/, not a Python library.
# `uv sync` still creates the venv + installs `dependencies`; without
# this `setuptools` would refuse the build because there's no module
# layout to pick up.
[tool.uv]
package = false
